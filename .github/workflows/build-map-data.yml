name: build map data

# Rebuilds every committed map data file from the GEM database on each run —
# GOGET outlines and centroids under trackers/ggit-goget/, GOGPT units and GGIT
# LNG terminals under trackers/ggit-goget-gogpt/ — with the open GOGET
# bulk-upload requests in the Asana Data team inbox overlaid on the GOGET
# files (see README, "The ggit-goget map"), and commits whatever changed. The
# combined maps load those files from raw.githubusercontent.com at runtime, so
# no Pages deploy is needed (a push made with GITHUB_TOKEN wouldn't trigger
# one anyway). The GGIT pipelines themselves come from the goit-ggit-data-ops
# workflow, not from here.
#
# Secrets: GEM_READONLY_DB_URL (read-only GEM project DB role) and
# ASANA_ACCESS_TOKEN (an Asana personal access token that can see the Data
# team inbox; used for GET requests only — the Asana tasks are never touched).
#
# Manual run: gh workflow run build-map-data.yml

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout gem-db-ops (owns the GEM database connection)
        uses: actions/checkout@v4
        with:
          repository: bairdlangenbrunner/gem-db-ops
          path: gem-db-ops

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # SQLAlchemy 2.1 made psycopg (v3) the default postgresql driver, while
        # gem-db-ops lists psycopg2 — install both so either resolves
        run: pip install sqlalchemy psycopg2-binary "psycopg[binary]" shapely requests

      - name: Download the open GOGET bulk uploads from Asana
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: python3 scripts/asana_goget_bulk_uploads.py

      - name: Build GOGET outlines and centroids, GOGPT units, LNG terminals
        env:
          GEM_READONLY_DB_URL: ${{ secrets.GEM_READONLY_DB_URL }}
          GEM_DB_OPS_REPO: ${{ github.workspace }}/gem-db-ops
        run: |
          python3 scripts/build_goget_areas.py
          python3 scripts/build_goget_map_data.py
          python3 scripts/build_gogpt_map_data.py
          python3 scripts/build_lng_map_data.py

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackers/ggit-goget/goget_areas_latest.geojson \
                  trackers/ggit-goget/goget_map_latest.geojson \
                  trackers/ggit-goget-gogpt/gogpt_map_latest.geojson \
                  trackers/ggit-goget-gogpt/lng_map_latest.geojson
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "refresh map data"
            git push
          fi
